<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banking SOAP Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-banking {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            transition: transform 0.3s;
        }
        .btn-banking:hover {
            transform: translateY(-2px);
            color: white;
        }
        .feature-card {
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #667eea;
        }
        .navbar {
            background: rgba(255,255,255,0.1) !important;
            backdrop-filter: blur(10px);
        }
        .table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-university me-2"></i>Banking SOAP
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/Banking">
                    <i class="fas fa-home me-1"></i>Home
                </a>
                <a class="nav-link" href="/Banking/AllAccounts">
                    <i class="fas fa-list me-1"></i>Daftar Akun
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>Akun berhasil dibuat dengan nomor: ACC-20260831-D62A0847
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-user me-2"></i>Detail Akun</h4>
            </div>
            <div class="card-body p-4">
                <div class="row mb-3">
                    <div class="col-md-4 fw-bold">Nomor Akun:</div>
                    <div class="col-md-8">
                        <span class="badge bg-primary fs-6">ACC-20260831-D62A0847</span>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4 fw-bold">Nama Pemegang:</div>
                    <div class="col-md-8">John Doe</div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4 fw-bold">Tipe Akun:</div>
                    <div class="col-md-8">Savings</div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4 fw-bold">Saldo:</div>
                    <div class="col-md-8">
                        <span class="text-success fw-bold fs-5">$1,000,000.00</span>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-md-4 fw-bold">Tanggal Dibuat:</div>
                    <div class="col-md-8">01 September 2026 01:06</div>
                </div>
                <hr />
                <div class="row g-2">
                    <div class="col">
                        <a href="/Banking/Deposit" class="btn btn-success w-100">
                            <i class="fas fa-arrow-down me-2"></i>Setor
                        </a>
                    </div>
                    <div class="col">
                        <a href="/Banking/Withdraw" class="btn btn-warning w-100">
                            <i class="fas fa-arrow-up me-2"></i>Tarik
                        </a>
                    </div>
                    <div class="col">
                        <a href="/Banking/Transfer" class="btn btn-info w-100">
                            <i class="fas fa-exchange-alt me-2"></i>Transfer
                        </a>
                    </div>
                    <div class="col">
                        <a href="/Banking/Transactions?accountNumber=ACC-20260831-D62A0847" class="btn btn-secondary w-100">
                            <i class="fas fa-history me-2"></i>Riwayat
                        </a>
                    </div>
                </div>
                <div class="mt-3">
                    <a href="/Banking" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-arrow-left me-2"></i>Kembali ke Menu
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
